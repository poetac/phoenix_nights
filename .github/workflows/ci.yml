name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: fork PRs run author-controlled npm ci / tests, so cap the
# GITHUB_TOKEN to read regardless of the repo's default token setting. The
# artifact upload uses the Actions API, not contents, so this is sufficient.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # no-undef + no-unused-vars only (see ROADMAP.md M8 #18) — the exact class of bug
      # that let SeasonsCard throw `TREND_START is not defined` on every render for months,
      # caught here in milliseconds instead of by a live-render smoke test.
      - run: npm run lint
      # pure-logic unit tests — the net under the numbers the smoke test can't check:
      # units conversion, the OLS/bootstrap stats, the freshness/staleness logic, the
      # sign/direction prose formatters (the recurring "wrong direction word" class), and
      # cities.js<->cities.py registry parity (the boi-orphan guard). `npm test` globs
      # tests/*.test.mjs, so a new suite auto-runs with no edit here (render-smoke.mjs,
      # which needs a served build, is not *.test.mjs and runs in the render job instead).
      - run: npm test
      # the same net, other language: the builders' pure logic (streak/season
      # spans, the CDD split identity) — offline, no ACIS, the layer where the
      # missing-high-vs-observed-low bug class lives. unittest is stdlib and the
      # runner ships python3, so no setup-python needed; run from the repo root.
      - name: Python builder unit tests
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s analysis/tests
      - run: npm run build
      # both products must build (explorer is default; desert is the second site)
      - run: npm run build:desert

  verify-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Hard gate: shape/finiteness/stdlib-imports — zero network, so a broken
      # commit fails this unconditionally, and an ACIS/NCEI outage can't hide it
      # by never reaching this far (M8 #14).
      - name: Verify offline (shape/finiteness/stdlib) — hard gate
        run: python3 analysis/verify_v0.py --mode offline
      # Soft: live value-checks against ACIS/NCEI. continue-on-error so an upstream
      # outage doesn't fail a PR that never touched data — rebuild-data.yml's
      # monthly/dispatch run (both phases, hard-fail) is the existing backstop that
      # still eventually catches a real regression before committing refreshed data.
      - name: Verify live value-checks against ACIS/NCEI — soft, retried
        run: python3 analysis/verify_v0.py --mode live
        continue-on-error: true

  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      # playwright is a pinned devDependency (package.json + lockfile, M8 #13) — npm ci
      # above already installed the npm package; only the browser binary needs fetching,
      # cached by the lockfile hash so a Dependabot bump invalidates it automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install Playwright chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: Serve build and run render smoke test
        run: |
          python3 -m http.server 8099 --directory dist >/tmp/srv.log 2>&1 &
          SRV=$!
          sleep 2
          BASE_URL=http://localhost:8099 node tests/render-smoke.mjs
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS
      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-screenshots
          path: apps/web/tests/__screens__/
          if-no-files-found: ignore
